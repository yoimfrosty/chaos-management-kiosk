<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Test</title>
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 6rem;
        }

        .modern-header {
            background-color: #ffffff;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-logo {
            width: 4rem;
            height: 4rem;
            background: linear-gradient(145deg, #10b981, #059669);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header-title {
            font-size: 1.875rem;
            font-weight: 700;
            color: #1f2937;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.125rem;
            font-weight: 600;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <header class="modern-header">
        <div class="header-left">
            <div class="header-logo">Logo</div>
            <h1 class="header-title">Ocean City Hemp Shop</h1>
        </div>
        <div class="header-right">
            <span>Self-Service kiosk</span>
            <div>Order No: <span class="text-gray-900">12345</span></div>
        </div>
    </header>
    
    <div style="background: white; padding: 2rem; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        <h2 style="color: #1f2937; margin-bottom: 1rem;">CSS Test Successful!</h2>
        <p style="color: #6b7280;">If you can see this styled properly, the CSS is working correctly.</p>
        <button style="background: linear-gradient(145deg, #10b981, #059669); color: white; padding: 0.75rem 1.5rem; border-radius: 0.5rem; border: none; font-weight: 600; margin-top: 1rem;">
            <i class="fa-solid fa-check"></i> Test Button
        </button>
    </div>
</body>
</html>
