<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Ocean green background circle -->
  <circle cx="16" cy="16" r="16" fill="#0d9488"/>
  
  <!-- Cannabis leaf in white/light green -->
  <g transform="translate(16, 16) scale(0.8)">
    <!-- Main cannabis leaf structure -->
    <path d="M0,-12 
             C-2,-10 -4,-6 -6,-2 
             C-8,0 -8,2 -6,4 
             C-4,6 -2,8 0,10
             C2,8 4,6 6,4 
             C8,2 8,0 6,-2 
             C4,-6 2,-10 0,-12 Z" 
          fill="#ffffff" opacity="0.9"/>
    
    <!-- Left serrated edges -->
    <path d="M-6,-2 L-8,-1 L-7,0 L-8,1 L-6,2 L-7,3 L-5,4 L-4,3 L-3,4 L-2,3 L-1,4 L0,3" 
          stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.8"/>
    
    <!-- Right serrated edges -->
    <path d="M6,-2 L8,-1 L7,0 L8,1 L6,2 L7,3 L5,4 L4,3 L3,4 L2,3 L1,4 L0,3" 
          stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.8"/>
    
    <!-- Center vein -->
    <path d="M0,-12 L0,10" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    
    <!-- Left side veins -->
    <path d="M0,-8 L-3,-4" stroke="#ffffff" stroke-width="0.6" opacity="0.6"/>
    <path d="M0,-4 L-4,0" stroke="#ffffff" stroke-width="0.6" opacity="0.6"/>
    <path d="M0,0 L-3,3" stroke="#ffffff" stroke-width="0.6" opacity="0.6"/>
    
    <!-- Right side veins -->
    <path d="M0,-8 L3,-4" stroke="#ffffff" stroke-width="0.6" opacity="0.6"/>
    <path d="M0,-4 L4,0" stroke="#ffffff" stroke-width="0.6" opacity="0.6"/>
    <path d="M0,0 L3,3" stroke="#ffffff" stroke-width="0.6" opacity="0.6"/>
    
    <!-- Stem -->
    <rect x="-0.5" y="8" width="1" height="4" fill="#ffffff" opacity="0.8" rx="0.5"/>
  </g>
</svg>
